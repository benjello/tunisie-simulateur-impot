[project]
name = "tunisie-simulateur-impot"
version = "0.1.0"
description = "Simulateur d'impôt sur le revenu (IRPP) pour la Tunisie, basé sur OpenFisca-Tunisia et Shiny for Python"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mahdi Ben Jelloul" }]
dependencies = [
    "shiny>=1.0",
    "openfisca-tunisia>=0.159",
    "openfisca-core[web-api]>=43",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/benjello/tunisie-simulateur-impot"
Repository = "https://github.com/benjello/tunisie-simulateur-impot"

[dependency-groups]
# Outils de build / déploiement (non embarqués dans l'app déployée).
dev = [
    "pytest>=8",
    "rsconnect-python>=1.33.2",
]

[tool.uv]
# Rien de spécifique pour l'instant.
